name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: shopmy
          POSTGRES_PASSWORD: shopmy
          POSTGRES_DB: shopmy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopmy -d shopmy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: shopmy/package-lock.json

      - name: Install dependencies
        working-directory: shopmy
        run: npm ci

      - name: Prisma migrate and generate
        working-directory: shopmy
        env:
          DATABASE_URL: postgresql://shopmy:shopmy@localhost:5432/shopmy_test
        run: npx prisma migrate deploy && npx prisma generate

      - name: Run linter
        working-directory: shopmy
        run: npm run lint

      - name: Run Prettier check
        working-directory: shopmy
        run: npm run format:check

      - name: Run type check
        working-directory: shopmy
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: shopmy
        run: npm run test

      - name: Build application
        working-directory: shopmy
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-build-only-min-32-chars
          DATABASE_URL: postgresql://shopmy:shopmy@localhost:5432/shopmy_test
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
